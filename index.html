<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Geschützte Seite</title>
<style>
:root{--navy:#14233B;--ink:#14233B;--mut:#5B6779;--desk:#E6ECF3;--paper:#fff;--line:#CCD6E2;--soft:#F1F5F9;
 --blue:#2456A6;--cran:#C24555;--pine:#3F8A69;--gold2:#B97A0E;--bad:#B23A4B;--badbg:#FBE7EA;--or:#9A5B00;--orbg:#FFF1D6;--okbg:#E3F3EA;--ok:#2F7D59;
 --type:"American Typewriter","Courier Prime","Rockwell","Courier New",Georgia,serif;
 --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
 --mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--desk);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,h5{font-family:var(--type);font-weight:600;line-height:1.2;margin:0}
:focus-visible{outline:3px solid #3C7DBF;outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.btn{border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;padding:11px 20px;min-height:46px}
.btn[disabled]{opacity:.55;cursor:default}
.feld{border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:11px 14px;min-height:46px;width:100%}
.klein{font-size:.86rem}.leise{color:var(--mut)}

/* Abfrage */
.tor{max-width:560px;margin:0 auto;padding-top:12vh}
.tor h1{font-size:1.7rem;margin-bottom:.5em}
.tor form{display:flex;gap:10px;flex-wrap:wrap;margin-top:.6em}
.tor form .feld{flex:1;min-width:220px}
.tor .wahl{display:flex;gap:18px;flex-wrap:wrap;margin-top:.9em}
.tor label{display:inline-flex;align-items:center;gap:7px}
.tor input[type=checkbox]{width:18px;height:18px}
.meldung{margin:.9em 0 0;min-height:1.3em}
.meldung.fehler{color:var(--bad);font-weight:600}

/* Kopf */
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}
.top .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:1.15rem;margin-right:auto;white-space:nowrap}
.top .feld{flex:1 1 260px;max-width:440px;min-height:42px;padding:8px 14px;border:0}
.top .sperren{border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:600;padding:9px 14px;border-radius:10px;min-height:42px}
.stand{margin:14px 2px 4px}

/* Farbe je Fach, für Inhalt und Liste */
.fach,.ifach{--c:var(--mut)}
.fach[data-fach="Englisch"],.ifach[data-fach="Englisch"]{--c:var(--blue)}
.fach[data-fach="Informatik"],.ifach[data-fach="Informatik"]{--c:var(--pine)}
.fach[data-fach="Politik-Wirtschaft"],.ifach[data-fach="Politik-Wirtschaft"]{--c:var(--cran)}

/* Inhalt: je Fach ein Block, je Gruppe eine Zeile mit ihren Themen */
html{scroll-behavior:smooth}
#inhalt,.fach,.gruppe,.thema{scroll-margin-top:var(--kopf,76px)}
.inhalt{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 18px 12px;margin-top:8px}
.ifach{padding:12px 0 6px;border-top:1px solid var(--line)}
.ifach:first-child{border-top:0}
.inhalt a{text-decoration:none;color:var(--ink)}
.ifn{display:inline-block;font-family:var(--type);font-weight:600;font-size:1.1rem;margin-bottom:4px}
.inhalt a.ifn{color:var(--c)}
.igr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:4px 0}
.ign{font-weight:700;font-size:.9rem}
.ith{display:flex;flex-wrap:wrap;gap:6px}
.ith a{font-size:.88rem;line-height:1.5;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:1px 11px}
.ith i{font-style:normal;font-weight:700;color:var(--c);margin-left:2px}
.ifn:hover,.ign:hover{text-decoration:underline}
.ith a:hover{border-color:var(--c)}
.hoch{position:fixed;right:16px;bottom:16px;z-index:6;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;border-radius:99px;padding:9px 16px;box-shadow:0 4px 14px rgba(20,35,59,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.hoch.da{opacity:1;pointer-events:auto}

/* Liste */
.fach{margin-top:30px}
.fach>h2{font-size:1.5rem;color:var(--c);border-bottom:3px solid var(--c);padding-bottom:6px}
.gruppe{margin-top:20px}
.gruppe>h3{display:inline-block;font-size:1rem;background:var(--navy);color:#fff;border-radius:9px;padding:4px 13px}
.thema{margin-top:10px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;padding:12px 14px 4px}
.thema>h4{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;font-size:1.06rem;margin-bottom:10px}
.thema>h4::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--c);flex:none;align-self:center}
.zahl{font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--mut)}
.seite{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:13px 16px 11px;margin-bottom:10px;break-inside:avoid}
.seite h5{font-size:1.06rem;margin-bottom:4px}
.was{margin:0 0 8px;font-size:.95rem;line-height:1.4;color:#2E3B52}
.seite dl{margin:0}
.zeile{display:grid;grid-template-columns:minmax(120px,210px) 1fr auto;gap:4px 12px;align-items:center;padding:5px 0;border-top:1px solid var(--soft)}
.zeile dt{color:var(--mut);font-size:.9rem}
.zeile dd{margin:0;min-width:0;overflow-wrap:anywhere}
.zeile code{font-family:var(--mono);font-weight:700;background:var(--soft);border-radius:7px;padding:2px 8px;font-size:.95rem}
.zeile a{color:var(--blue)}
.marke{display:inline-block;font-size:.72rem;font-weight:700;color:var(--or);background:var(--orbg);border-radius:6px;padding:1px 6px;white-space:nowrap}
.offen{font-weight:700;color:var(--bad);background:var(--badbg);border-radius:7px;padding:2px 8px}
.frei{color:var(--ok);background:var(--okbg);border-radius:7px;padding:2px 8px;font-weight:600}
.kopie{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:5px 11px;font-size:.84rem;font-weight:600;min-width:86px;min-height:34px}
.kopie.fertig{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.notiz{margin:8px 0 0;font-size:.86rem;color:var(--mut)}
.leer{margin-top:28px;text-align:center;color:var(--mut)}

@media (max-width:620px){
  .zeile{grid-template-columns:1fr auto}
  .zeile dt{grid-column:1 / -1}
  .igr{grid-template-columns:1fr;gap:3px}
  .thema{padding:10px 9px 2px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{
  body{background:#fff;font-size:11pt}
  .top{position:static;background:none;color:#000}
  .top .feld,.top .sperren,.tat,.kopie,.hoch{display:none!important}
  .gruppe>h3{background:none;color:#000;padding:0;font-size:1.15rem}
  .thema{background:none;border-color:#999}
  .ith a{background:none}
  .zeile{grid-template-columns:minmax(120px,210px) 1fr}
  .wrap{padding:0;max-width:none}
  .seite{border-color:#999}
  .zeile a{color:#000;text-decoration:none}
}
</style>
</head>

// Tresor: Text mit einem Passwortsatz sichern und wieder lesbar machen.
// Die Datei wird unveraendert in die Seite eingebettet und nutzt deshalb nur,
// was Node und Browser gemeinsam haben (WebCrypto, TextEncoder, atob/btoa).
const MIN_LAENGE = 20;
const RUNDEN = 600000;

// Es zaehlen nur Buchstaben und Ziffern. Gross- und Kleinschreibung, Leerzeichen, Satzzeichen
// und die Schreibweise von Umlauten sind egal: Ein iPad macht beim Tippen aus zwei Leerzeichen
// einen Punkt und aus einem geraden Apostroph einen typografischen.
function normalisiere(passwortsatz) {
  return String(passwortsatz).normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
}

function _tB64(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function _tB64d(text) {
  let s = String(text).replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

async function _tSchluessel(passwortsatz, salz, runden, zweck) {
  const roh = await crypto.subtle.importKey('raw', new TextEncoder().encode(normalisiere(passwortsatz)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: salz, iterations: runden, hash: 'SHA-256'}, roh, {name: 'AES-GCM', length: 256}, false, [zweck]);
}

async function verschluessele(klartext, passwortsatz) {
  if ([...normalisiere(passwortsatz)].length < MIN_LAENGE) throw new Error('Passwortsatz zu kurz');
  const salz = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const schluessel = await _tSchluessel(passwortsatz, salz, RUNDEN, 'encrypt');
  const geheim = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, schluessel, new TextEncoder().encode(klartext)));
  return {n: RUNDEN, s: _tB64(salz), i: _tB64(iv), c: _tB64(geheim)};
}

// Liefert den Klartext oder null, wenn der Passwortsatz nicht passt oder das Paket beschaedigt ist.
async function entschluessele(paket, passwortsatz) {
  try {
    const schluessel = await _tSchluessel(passwortsatz, _tB64d(paket.s), paket.n, 'decrypt');
    const klar = await crypto.subtle.decrypt({name: 'AES-GCM', iv: _tB64d(paket.i)}, schluessel, _tB64d(paket.c));
    return new TextDecoder().decode(klar);
  } catch (e) {
    return null;
  }
}

// Ansicht: gliedern, suchen und als HTML ausgeben. Ohne DOM, damit es in Node testbar ist.
// Die Datei wird unveraendert in die Seite eingebettet (keine Importe).
const FAECHER = ['Englisch', 'Informatik', 'Politik-Wirtschaft', 'Sonstiges'];

function maskiere(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const _aVergleich = (a, b) => String(a).localeCompare(String(b), 'de', {numeric: true});

// Gruppen mit Zahl im Namen zuerst, nach dieser Zahl; alle anderen danach alphabetisch.
function _aGruppenVergleich(a, b) {
  const zahl = name => { const m = /\d+/.exec(name); return m ? Number(m[0]) : Infinity; };
  return zahl(a) - zahl(b) || _aVergleich(a, b);
}

function _aBuendeln(eintraege, schluessel, vergleich) {
  const karte = new Map();
  for (const e of eintraege) {
    const k = e[schluessel];
    if (!karte.has(k)) karte.set(k, []);
    karte.get(k).push(e);
  }
  return [...karte.entries()].sort((x, y) => vergleich(x[0], y[0]));
}

// Fächer in fester Reihenfolge, Gruppen nach Jahrgang, Themen nach Alphabet. Die Seiten eines
// Themas bleiben so, wie sie in der Liste stehen: Das ist die Reihenfolge im Unterricht.
function gliedere(seiten) {
  const ergebnis = [];
  for (const fach of FAECHER) {
    const imFach = seiten.filter(x => x.fach === fach);
    if (imFach.length === 0) continue;
    const gruppen = _aBuendeln(imFach, 'gruppe', _aGruppenVergleich).map(([gruppe, inGruppe]) => ({
      gruppe,
      themen: _aBuendeln(inGruppe, 'thema', _aVergleich).map(([thema, imThema]) => ({
        thema,
        seiten: imThema,
      })),
    }));
    ergebnis.push({fach, gruppen});
  }
  return ergebnis;
}

// Fuer die Suche: klein, Umlaute einheitlich, typografische Zeichen wie getippt
// (Apostrophe, Anfuehrungszeichen, alle Arten von Strichen, geschuetzte Leerzeichen).
const _aKlein = text => String(text).normalize('NFC').toLocaleLowerCase('de')
  .replace(/[\u2018\u2019\u02BC\u0060\u00B4]/g, "'")
  .replace(/[\u201C\u201D\u201E\u00AB\u00BB]/g, '"')
  .replace(/[\u2010\u2011\u2012\u2013\u2014\u2212]/g, '-')
  .replace(/\u00A0/g, ' ');

function _aSuchtext(seite) {
  const teile = [seite.titel, seite.fach, seite.gruppe, seite.thema, seite.beschreibung || '', seite.notiz || '', seite.link, seite.repo];
  for (const z of seite.zugaenge) teile.push(z.name, z.wert === null ? 'offen' : z.wert);
  if (seite.schutz === 'keiner') teile.push('ohne Passwort');
  return _aKlein(teile.join(' \n '));
}

// Alle Suchwörter müssen vorkommen. Eine leere Suche zeigt alles.
function filtere(seiten, suchtext) {
  const woerter = _aKlein(suchtext || '').split(/\s+/).filter(Boolean);
  if (woerter.length === 0) return seiten;
  return seiten.filter(seite => {
    const text = _aSuchtext(seite);
    return woerter.every(wort => text.includes(wort));
  });
}

const _aKnopf = wert => `<button type="button" class="kopie" data-kopie="${maskiere(wert)}">Kopieren</button>`;

function _aZeile(name, inhalt, knopf, klasse, marke) {
  return `<div class="zeile${klasse ? ' ' + klasse : ''}"><dt>${maskiere(name)}${marke ? ` <span class="marke">${marke}</span>` : ''}</dt><dd>${inhalt}</dd><dd class="tat">${knopf}</dd></div>`;
}

const _aVerweis = adresse => `<a href="${maskiere(adresse)}" target="_blank" rel="noopener">${maskiere(adresse.replace(/^https:\/\//, ''))}</a>`;

function _aSeite(seite) {
  const zeilen = [];
  zeilen.push(_aZeile('Link', _aVerweis(seite.link), _aKnopf(seite.link), 'link'));
  if (seite.schutz === 'keiner') {
    zeilen.push(_aZeile('Zugang', '<span class="frei">ohne Passwort</span>', '', ''));
  }
  for (const z of seite.zugaenge) {
    const lehrkraft = z.fuer === 'lehrkraft';
    if (z.wert === null) {
      zeilen.push(_aZeile(z.name, '<span class="offen">offen</span>', '', lehrkraft ? 'lehrkraft' : '', lehrkraft ? 'nur Lehrkraft' : ''));
    } else {
      // Ein Wert, der selbst eine Adresse ist (etwa die Lehrerfassung), wird anklickbar.
      // (Als Muster geschrieben, damit in der veröffentlichten Datei keine Adresse im Klartext steht.)
      const inhalt = /^https:\/\//.test(z.wert) ? _aVerweis(z.wert) : `<code>${maskiere(z.wert)}</code>`;
      zeilen.push(_aZeile(z.name, inhalt, _aKnopf(z.wert), lehrkraft ? 'lehrkraft' : '', lehrkraft ? 'nur Lehrkraft' : ''));
    }
  }
  const was = seite.beschreibung ? `<p class="was">${maskiere(seite.beschreibung)}</p>` : '';
  const notiz = seite.notiz ? `<p class="notiz">${maskiere(seite.notiz)}</p>` : '';
  return `<article class="seite"><h5>${maskiere(seite.titel)}</h5>${was}<dl>${zeilen.join('')}</dl>${notiz}</article>`;
}

// Sprungziele wie f1, f1g2, f1g2t3. Nur Zahlen, damit kein Name aus der Liste in einer Kennung steht.
const _aZiel = (f, g, t) => 'f' + (f + 1) + (g === undefined ? '' : 'g' + (g + 1)) + (t === undefined ? '' : 't' + (t + 1));

function alsHtml(seiten) {
  if (seiten.length === 0) return '<p class="leer">Keine Treffer.</p>';
  return gliedere(seiten).map((f, fi) =>
    `<section class="fach" id="${_aZiel(fi)}" data-fach="${maskiere(f.fach)}"><h2>${maskiere(f.fach)}</h2>` +
    f.gruppen.map((g, gi) =>
      `<div class="gruppe" id="${_aZiel(fi, gi)}"><h3>${maskiere(g.gruppe)}</h3>` +
      g.themen.map((t, ti) =>
        `<div class="thema" id="${_aZiel(fi, gi, ti)}"><h4>${maskiere(t.thema)}${t.seiten.length > 1 ? ` <span class="zahl">${t.seiten.length} Seiten</span>` : ''}</h4>${t.seiten.map(_aSeite).join('')}</div>`
      ).join('') + '</div>'
    ).join('') + '</section>'
  ).join('');
}

// Inhaltsverzeichnis zu genau dieser Liste: je Fach ein Block, je Gruppe eine Zeile mit ihren Themen.
// Jeder Eintrag springt zu seinem Abschnitt. Hat ein Thema mehrere Seiten, steht die Zahl dahinter.
function inhaltHtml(seiten) {
  if (seiten.length === 0) return '';
  return '<nav class="inhalt" aria-label="Inhalt">' + gliedere(seiten).map((f, fi) =>
    `<div class="ifach" data-fach="${maskiere(f.fach)}"><a class="ifn" href="#${_aZiel(fi)}">${maskiere(f.fach)}</a>` +
    f.gruppen.map((g, gi) =>
      `<div class="igr"><a class="ign" href="#${_aZiel(fi, gi)}">${maskiere(g.gruppe)}</a><span class="ith">` +
      g.themen.map((t, ti) =>
        `<a href="#${_aZiel(fi, gi, ti)}">${maskiere(t.thema)}${t.seiten.length > 1 ? ` <i>${t.seiten.length}</i>` : ''}</a>`
      ).join('') + '</span></div>'
    ).join('') + '</div>'
  ).join('') + '</nav>';
}

(function () {
  'use strict';
  // Der Passwortsatz wird nirgends im Browser abgelegt: Alle Unterrichtsseiten liegen unter
  // derselben Herkunft und könnten einen solchen Speicher mitlesen. Wer ihn nicht jedes Mal
  // tippen will, lässt ihn vom Schlüsselbund des Geräts ausfüllen.
  const app = document.getElementById('app');
  let seiten = null;

  async function oeffne(satz) {
    const klar = await entschluessele(PAKET, satz);
    if (klar === null) return false;
    seiten = JSON.parse(klar);
    zeigeListe();
    return true;
  }

  function zeigeAbfrage(meldung, alsFehler) {
    seiten = null;
    window.onresize = null;
    window.onscroll = null;
    app.innerHTML =
      '<div class="wrap tor"><div class="card">' +
      '<h1>Geschützte Seite</h1>' +
      '<p class="leise">Diese Seite öffnet sich nur mit dem Passwortsatz.</p>' +
      '<form id="tor"><input class="feld" id="satz" type="password" placeholder="Passwortsatz" aria-label="Passwortsatz" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">' +
      '<button class="btn" id="auf">Öffnen</button></form>' +
      '<div class="wahl klein"><label><input type="checkbox" id="zeigen"> Eingabe anzeigen</label></div>' +
      '<p class="meldung klein" id="meldung" role="status"></p>' +
      '</div></div>';
    const feld = document.getElementById('satz');
    const knopf = document.getElementById('auf');
    const hinweis = document.getElementById('meldung');
    const sage = (text, fehler) => { hinweis.textContent = text || ''; hinweis.className = 'meldung klein' + (fehler ? ' fehler' : ''); };
    sage(meldung, alsFehler);
    document.getElementById('zeigen').onchange = e => { feld.type = e.target.checked ? 'text' : 'password'; };
    document.getElementById('tor').onsubmit = async e => {
      e.preventDefault();
      const satz = feld.value;
      if (!satz.trim()) { feld.focus(); return; }
      knopf.disabled = true;
      sage('Wird geöffnet …');
      if (await oeffne(satz)) return;
      knopf.disabled = false;
      sage('Das ist nicht der Passwortsatz.', true);
      feld.select();
    };
    feld.focus();
  }

  function zeigeListe() {
    const luecken = seiten.filter(s => s.zugaenge.some(z => z.wert === null)).length;
    app.innerHTML =
      '<div class="top"><div class="in"><h1>Übersicht Unterrichtsseiten</h1>' +
      '<input class="feld" id="suche" type="search" placeholder="Suchen: Fach, Thema, Titel, Code" aria-label="Suchen" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">' +
      '<button class="sperren" id="sperren" type="button">Sperren</button></div></div>' +
      '<div class="wrap"><p class="stand klein leise" id="stand" role="status"></p><div id="inhalt"></div><div id="liste"></div></div>' +
      '<a class="hoch" id="hoch" href="#inhalt">↑ Inhalt</a>';
    const suche = document.getElementById('suche');
    const inhalt = document.getElementById('inhalt');
    const liste = document.getElementById('liste');
    const stand = document.getElementById('stand');
    // Sprungziele sollen unter der festen Kopfzeile landen, die auf schmalen Geräten zweizeilig ist.
    const kopf = document.querySelector('.top');
    const hoch = document.getElementById('hoch');
    const messe = () => document.documentElement.style.setProperty('--kopf', (kopf.offsetHeight + 12) + 'px');
    window.onresize = messe;
    window.onscroll = () => hoch.classList.toggle('da', window.scrollY > 600);
    messe();
    const male = text => {
      const treffer = filtere(seiten, text);
      inhalt.innerHTML = inhaltHtml(treffer);
      liste.innerHTML = alsHtml(treffer);
      const zahl = treffer.length === seiten.length ? seiten.length + ' Seiten' : treffer.length + ' von ' + seiten.length + ' Seiten';
      stand.textContent = zahl + (luecken ? ' · ' + luecken + ' mit offenen Angaben (Suche: offen)' : '');
    };
    suche.oninput = () => male(suche.value);
    document.getElementById('sperren').onclick = () => zeigeAbfrage('Gesperrt.');
    liste.onclick = e => {
      const knopf = e.target.closest('[data-kopie]');
      if (knopf) kopiere(knopf);
    };
    // Im Ausdruck stehen immer alle Einträge, auch wenn gerade gesucht wird.
    window.onbeforeprint = () => { if (seiten) male(''); };
    window.onafterprint = () => { if (seiten) male(suche.value); };
    male('');
  }

  async function kopiere(knopf) {
    const wert = knopf.getAttribute('data-kopie');
    let ok = false;
    try { await navigator.clipboard.writeText(wert); ok = true; } catch (e) { ok = kopiereAlt(wert); }
    const alt = 'Kopieren';
    knopf.textContent = ok ? 'kopiert' : 'nicht möglich';
    knopf.classList.toggle('fertig', ok);
    setTimeout(() => { knopf.textContent = alt; knopf.classList.remove('fertig'); }, 1500);
  }

  function kopiereAlt(wert) {
    const feld = document.createElement('textarea');
    feld.value = wert;
    feld.setAttribute('readonly', '');
    feld.style.position = 'fixed';
    feld.style.opacity = '0';
    document.body.appendChild(feld);
    feld.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    feld.remove();
    return ok;
  }

  (async function start() {
    if (!(window.crypto && window.crypto.subtle)) {
      app.innerHTML = '<div class="wrap tor"><div class="card"><h1>Geschützte Seite</h1><p>Dieser Browser kann die Seite nicht öffnen.</p></div></div>';
      return;
    }
    zeigeAbfrage('');
  })();
})();
</script>
</body>
</html>
